name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytest pyinstaller PySide6-Essentials

      - name: Run tests (headless)
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pytest -q

      - name: Build onedir exe
        run: >
          pyinstaller --onedir --name dlm --console
          --icon assets/dlm.ico --version-file assets/version_info.txt
          --noconfirm --clean run_dlm.py

      - name: Package portable zip
        run: |
          New-Item -ItemType Directory -Force -Path installer/Output | Out-Null
          Compress-Archive -Path dist/dlm -DestinationPath installer/Output/dlm-0.1.1-win64.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\dlm.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dlm-win64
          path: |
            installer/Output/dlm-0.1.1-win64.zip
            installer/Output/dlm-setup-0.1.1.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/Output/dlm-0.1.1-win64.zip
            installer/Output/dlm-setup-0.1.1.exe
